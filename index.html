*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#999999;color:#1a1a1a;max-width:480px;margin:0 auto;min-height:100vh}
input,select,textarea{width:100%;padding:11px 13px;border:2.5px solid #1a1a1a;border-radius:10px;font-size:15px;background:#fff;font-family:inherit;color:#1a1a1a;outline:none;display:block;font-weight:700}
input:focus,select:focus,textarea:focus{border-color:#0F6E56;border-width:2.5px}
input::placeholder,textarea::placeholder{color:#888;font-weight:400}
select option{font-weight:400;color:#1a1a1a}
textarea{resize:vertical}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
.bg{background:#0F6E56;color:#fff}
.bw{background:#25D366;color:#fff}
.bb{background:#1565c0;color:#fff}
.bx{background:#eee;color:#333;border:1px solid #ddd}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.15);border:2.5px solid #1a1a1a}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.bgn{background:#e8f5e9;color:#1b5e20}
.bbl{background:#e3f2fd;color:#0d47a1}
.bor{background:#fff3e0;color:#bf360c}
.brd{background:#ffebee;color:#b71c1c}
.lbl{font-size:12px;color:#666;display:block;margin:12px 0 4px;font-weight:500}
.hdr{background:#0F6E56;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e0e0e0;display:flex;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,0.08)}
.nb{flex:1;border:none;background:transparent;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.pg{padding:14px 14px 80px}
.row{display:flex;gap:10px;align-items:center}
.st{background:#fff;border-radius:12px;padding:12px 14px;flex:1;box-shadow:0 2px 8px rgba(0,0,0,0.15);border:2.5px solid #1a1a1a}
.bk{background:none;border:none;color:#0F6E56;font-size:14px;font-weight:600;cursor:pointer;padding:4px 0 14px;display:flex;align-items:center;gap:4px}
.sp{height:1px;background:#eee;margin:10px 0}
.re{background:#e8f5e9;border-radius:8px;padding:9px 12px;font-size:13px;color:#1b5e20;margin:6px 0;font-weight:500}
.wn{background:#ffebee;border-radius:10px;padding:12px 14px;font-size:13px;color:#b71c1c;font-weight:600;margin-top:10px;border:2.5px solid #e53935}
.alb{background:#fff8e1;border:1px solid #ffc107;border-radius:10px;padding:12px 14px;margin:10px 14px 0}
.rb{border:2.5px solid #1a1a1a;border-radius:10px;padding:12px;margin:10px 0}
.rc{display:flex;align-items:center;gap:10px;background:#f5f5f5;border-radius:10px;padding:12px 14px;margin-top:12px}
.rc input[type=checkbox]{width:22px;height:22px;cursor:pointer;accent-color:#0F6E56}
.rc label{font-size:14px;font-weight:600;cursor:pointer}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sb{background:#f9f9f9;border:2.5px solid #1a1a1a;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.stl{font-size:15px;font-weight:700;color:#0F6E56;margin-bottom:12px}
.sr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee;font-size:13px}
.sr:last-child{border-bottom:none}
.sl{color:#666}
.sv{font-weight:600;text-align:right;max-width:60%}
.ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);z-index:9999;padding:16px;box-sizing:border-box;overflow-y:auto}
.oi{background:#fff;border-radius:14px;padding:16px}

/* ========== RESPONSIVE DESKTOP / MOBILE ========== */
@media (min-width: 768px) {
  html,body { height: 100%; overflow: hidden; }
  body { background: #0d1117; margin: 0; display: flex; flex-direction: column; max-width: 100%; }
  #app-wrapper { display: flex; height: 100vh; width: 100%; overflow: hidden; }
  #sidebar { width: 260px; flex-shrink: 0; background: linear-gradient(180deg,#0F6E56 0%,#085041 100%); display: flex; flex-direction: column; overflow-y: auto; }
  #sidebar-top { padding: 24px 20px 16px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.15); }
  #sidebar-logo { width: 90px; height: 90px; border-radius: 18px; object-fit: cover; display: block; margin: 0 auto 12px; border: 3px solid rgba(255,255,255,0.4); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  #sidebar-name { color: #fff; font-weight: 700; font-size: 15px; margin-bottom: 3px; }
  #sidebar-sub { color: #9FE1CB; font-size: 11px; }
  #sidebar-nav { padding: 16px 12px; flex: 1; }
  #sidebar-nav button { background: transparent; color: #e0f2ef; border: none; border-radius: 10px; padding: 11px 14px; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 3px; transition: background 0.15s; }
  #sidebar-nav button:hover { background: rgba(255,255,255,0.12); }
  #sidebar-nav button.active { background: rgba(255,255,255,0.22); color: #fff; }
  #sidebar-stats { padding: 12px 16px 20px; border-top: 1px solid rgba(255,255,255,0.15); }
  #sidebar-stats .stat-item { display: flex; justify-content: space-between; color: #9FE1CB; font-size: 12px; padding: 5px 0; }
  #sidebar-stats .stat-item span { color: #fff; font-weight: 700; }
  #main-content { flex: 1; overflow-y: auto; background: #b3b3b3; display: flex; flex-direction: column; }
  #desktop-header { background: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.1); flex-shrink: 0; }
  #desktop-header-title { font-size: 18px; font-weight: 700; color: #0F6E56; }
  #desktop-header-user { font-size: 13px; color: #666; display: flex; align-items: center; gap: 8px; background: #e8f5e9; padding: 6px 12px; border-radius: 20px; }
  #desktop-header-user strong { color: #0F6E56; font-weight: 700; }
  #R { flex: 1; }
  #R .hdr { display: none !important; }
  #R .nav { display: none !important; }
  #R .pg { padding: 20px 24px 30px; max-width: 900px; background: transparent; }
  #R .card { border-radius: 12px; }
}
@media (max-width: 767px) {
  #app-wrapper { display: block; }
  #sidebar { display: none !important; }
  #desktop-header { display: none !important; }
  #main-content { width: 100%; }
  body { max-width: 480px; margin: 0 auto; background: #999999; }
}

<script>
// PWA Install prompt
var deferredPrompt;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  deferredPrompt=e;
  var ib=document.getElementById("installBtn");
  if(ib) ib.style.display="flex";
  var mid=document.getElementById("mobileInstallDiv");
  if(mid) mid.style.display="block";
});
window.addEventListener("appinstalled",function(){
  deferredPrompt=null;
  var ib=document.getElementById("installBtn");
  if(ib) ib.style.display="none";
});
function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(r){
      deferredPrompt=null;
      var ib=document.getElementById("installBtn");
      if(ib) ib.style.display="none";
    });
  }
}
</script>

function iprtText(txt){
  try{
    var imp=JSON.parse(txt);
    if(!imp.c||!imp.d||!imp.a){alert("Texte invalide. Assurez-vous de coller le texte complet de la sauvegarde.");return;}
    if(confirm("Restaurer :\n- "+imp.c.length+" clients\n- "+imp.d.length+" depots\n- "+imp.a.length+" abonnements\n\nLes donnees actuelles seront remplacees.")){
      D=imp;sv();cl("bkOvl");re();
      alert("Restauration reussie ! "+imp.c.length+" clients, "+imp.d.length+" depots, "+imp.a.length+" abonnements.");
    }
  }catch(err){
    alert("Texte invalide ou incomplet.\n\nAssurez-vous de copier TOUT le texte de sauvegarde depuis le debut jusqu a la fin.");
  }
}

function iprt(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    iprtText(e.target.result);
    cl("bkOvl");
  };
  reader.readAsText(file);
}

var ADMIN = {nom:"Jean Marc", user:"Jean Marc", mdp:"jeanmarcamp", role:"admin"};

function getUsers(){
  try{
    var u=JSON.parse(localStorage.getItem("mdUsers")||"null");
    if(!u){
      // Initialiser avec admin
      u=[ADMIN];
      localStorage.setItem("mdUsers",JSON.stringify(u));
    }
    // S assurer que l admin est toujours present
    var hasAdmin=u.find(function(x){return x.user===ADMIN.user;});
    if(!hasAdmin){u.unshift(ADMIN);localStorage.setItem("mdUsers",JSON.stringify(u));}
    return u;
  }catch(e){return [ADMIN];}
}
function saveUsers(u){localStorage.setItem("mdUsers",JSON.stringify(u));}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem("mdCurrentUser")||"null");}catch(e){return null;}}
function setCurrentUser(u){localStorage.setItem("mdCurrentUser",JSON.stringify(u));}
function isAdmin(){var u=getCurrentUser();return u&&u.user===ADMIN.user;}

function checkAuth(){
  var session=localStorage.getItem("mdSession");
  var today=new Date().toDateString();
  if(session===today&&getCurrentUser()) return true;
  return false;
}

}

  pl.textContent="Mot de passe";
  var pInp=document.createElement("input");
  pInp.type="password";pInp.id="loginMdp";pInp.placeholder="Mot de passe";
  pInp.style.cssText=inpStyle()+"margin-bottom:8px;";

  var err=document.createElement("div");
  err.id="loginErr";
  err.style.cssText="color:#e53935;font-size:12px;text-align:center;margin-bottom:12px;min-height:18px;font-weight:600";

  var btn=document.createElement("button");
  btn.style.cssText="background:#0F6E56;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%";
  btn.textContent="Se connecter";
  btn.onclick=function(){
    var u=document.getElementById("loginUser").value.trim();
    var p=document.getElementById("loginMdp").value;
    var users=getUsers();
    var found=users.find(function(x){return x.user===u&&x.mdp===p;});
    if(found){
      localStorage.setItem("mdSession",new Date().toDateString());
      setCurrentUser(found);
      var ov2=document.getElementById("loginOvl");
      if(ov2)ov2.remove();
      re();
    } else {
      document.getElementById("loginErr").textContent="Nom d utilisateur ou mot de passe incorrect";
    }
  };
  pInp.addEventListener("keypress",function(e){if(e.key==="Enter")btn.click();});

  box.appendChild(lttl);
  box.appendChild(ul);box.appendChild(uInp);
  box.appendChild(pl);box.appendChild(pInp);
  box.appendChild(err);box.appendChild(btn);
  ov.appendChild(logo);ov.appendChild(ttl);ov.appendChild(sub);ov.appendChild(box);
  document.body.appendChild(ov);
  setTimeout(function(){uInp.focus();},300);
}

function logout(){
  if(!confirm("Voulez-vous vraiment vous deconnecter ?")) return;
  localStorage.removeItem("mdSession");
  localStorage.removeItem("mdCurrentUser");
  var root=document.getElementById("R");
  if(root) root.innerHTML="";
  showLogin();
}

function showSecurite(){
  if(!isAdmin()){
    alert("Acces refuse. Seul Jean Marc (administrateur) peut acceder a la securite.");
    return;
  }
  cl("bkOvl");
  var users=getUsers();
  var ov=document.createElement("div");ov.id="bkOvl";ov.className="ov";
  var inn=document.createElement("div");inn.className="oi";

  var ttl=document.createElement("div");
  ttl.style.cssText="font-weight:700;font-size:16px;color:#0F6E56;margin-bottom:6px";
  ttl.innerHTML="&#128274; Securite - Administration";

  var inf=document.createElement("div");
  inf.style.cssText="font-size:12px;color:#666;margin-bottom:14px;background:#e8f5e9;padding:8px 10px;border-radius:8px;font-weight:600";
  inf.textContent="Connecte en tant que : Jean Marc (Administrateur)";

  // ---- SECTION : Ajouter utilisateur ----
  var sec1=document.createElement("div");
  sec1.style.cssText="font-weight:700;font-size:14px;color:#333;margin:14px 0 10px;border-bottom:2px solid #0F6E56;padding-bottom:6px";
  sec1.textContent="Ajouter un utilisateur";

  var fields=[
    ["Nom et Prenom","addNom","text"],
    ["Nom d utilisateur","addUser","text"],
    ["Mot de passe","addMdp","password"],
    ["Confirmer mot de passe","addMdp2","password"]
  ];

  fields.forEach(function(f){
    var lbl=document.createElement("label");
    lbl.style.cssText="font-size:12px;color:#1a1a1a;display:block;margin:10px 0 4px;font-weight:700";
    lbl.textContent=f[0];
    var inp=document.createElement("input");
    inp.type=f[2];inp.id=f[1];inp.placeholder=f[0];
    inp.style.cssText=inpStyle();
    inn.appendChild(lbl);inn.appendChild(inp);
  });

  var errAdd=document.createElement("div");
  errAdd.id="errAdd";
  errAdd.style.cssText="color:#e53935;font-size:12px;text-align:center;margin:6px 0;min-height:16px;font-weight:600";

  var btnAdd=document.createElement("button");
  btnAdd.style.cssText="background:#0F6E56;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:6px";
  btnAdd.textContent="+ Ajouter l utilisateur";
  btnAdd.onclick=function(){
    var nom=document.getElementById("addNom").value.trim();
    var user=document.getElementById("addUser").value.trim();
    var mdp=document.getElementById("addMdp").value;
    var mdp2=document.getElementById("addMdp2").value;
    var e=document.getElementById("errAdd");
    if(!nom||!user){e.textContent="Nom et nom d utilisateur obligatoires";return;}
    if(!mdp){e.textContent="Mot de passe obligatoire";return;}
    if(mdp!==mdp2){e.textContent="Les mots de passe ne correspondent pas";return;}
    var u2=getUsers();
    if(u2.find(function(x){return x.user===user;})){e.textContent="Ce nom d utilisateur existe deja";return;}
    u2.push({nom:nom,user:user,mdp:mdp,role:"user"});
    saveUsers(u2);
    cl("bkOvl");
    alert("Utilisateur "+nom+" ajoute avec succes !");
    showSecurite();
  };

  // ---- SECTION : Liste utilisateurs ----
  var sec2=document.createElement("div");
  sec2.style.cssText="font-weight:700;font-size:14px;color:#333;margin:18px 0 10px;border-bottom:2px solid #0F6E56;padding-bottom:6px";
  sec2.textContent="Utilisateurs enregistres ("+users.length+")";

  var ul=document.createElement("ul");
  ul.style.cssText="list-style:none;padding:0;margin:0";
  users.forEach(function(u){
    var li=document.createElement("li");
    li.style.cssText="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f5f5f5;border-radius:8px;margin-bottom:8px;border:2.5px solid #1a1a1a";
    var info=document.createElement("div");
    var nm=document.createElement("div");
    nm.style.cssText="font-weight:700;font-size:13px;color:#1a1a1a";
    nm.textContent=(u.nom||u.user)+(u.user===ADMIN.user?" (Admin)":"");
    var un=document.createElement("div");
    un.style.cssText="font-size:11px;color:#666";
    un.textContent="@"+u.user;
    info.appendChild(nm);info.appendChild(un);
    li.appendChild(info);
    if(u.user!==ADMIN.user){
      var bd=document.createElement("button");
      bd.style.cssText="background:#ffebee;color:#e53935;border:1.5px solid #ef9a9a;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer";
      bd.textContent="Retirer";
      bd.onclick=(function(usr){return function(){
        if(!confirm("Retirer l utilisateur "+usr.nom+" ?")){return;}
        var u3=getUsers().filter(function(x){return x.user!==usr.user;});
        saveUsers(u3);
        cl("bkOvl");
        showSecurite();
      };})(u);
      li.appendChild(bd);
    }
    ul.appendChild(li);
  });

  var bx=document.createElement("button");
  bx.style.cssText="background:#eee;color:#333;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:14px";
  bx.textContent="Fermer";
  bx.onclick=function(){cl("bkOvl");};

  inn.appendChild(ttl);inn.appendChild(inf);inn.appendChild(sec1);
  inn.appendChild(errAdd);inn.appendChild(btnAdd);
  inn.appendChild(sec2);inn.appendChild(ul);inn.appendChild(bx);
  ov.appendChild(inn);document.body.appendChild(ov);
}

if(!checkAuth()){showLogin();}else{re();}
</script>
</body>
</html>
